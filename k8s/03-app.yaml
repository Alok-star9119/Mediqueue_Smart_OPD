apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediqueue
  namespace: mediqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediqueue
  template:
    metadata:
      labels:
        app: mediqueue
    spec:
      containers:
        - name: api
          image: mediqueue-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mediqueue-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mediqueue
  namespace: mediqueue
spec:
  type: ClusterIP
  selector:
    app: mediqueue
  ports:
    - port: 80
      targetPort: 8000
